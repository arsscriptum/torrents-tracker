{% extends 'base.html' %}

{% block search_torrents_page %}
<div class="container-fluid container__wrapper">
    <div class="container">
        <div class="site__wrapper">
            <form class="mt-3" method="GET" action="{% url 'searchTorrents' %}">
                <div class="form-group">
                    <input type="text" placeholder="Title,Keywords..etc" class="search-box__input" name="keywords"
                        autocomplete="off">
                    <button type="submit" class="search-box__button">SEARCH</button>
                </div>
            </form>
            <h5 class="my-3 text-white">Found total {{ torrents|length }} results for "{{ keywords }}"</h5>
            <div>
                <table class="table _table table-dark">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Seeds</th>
                            <th>Peers</th>
                            <th>Size</th>
                            <th>Download</th>
                        </tr>
                    </thead>
                    {% for torrent in torrents %}
                    <tr>
                        <td>{{ torrent.title }}</td>
                        <td>{{ torrent.seeds }}</td>
                        <td>{{ torrent.peers }}</td>
                        <td>{{ torrent.size }}</td>
                        <td><a class="magnet-link__button" href="#" data-magnet="{{ torrent.magnet }}">Download</a></td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.magnet-link__button');

        buttons.forEach(button => {
            button.addEventListener('click', function(event) {
                event.preventDefault();

                const magnetLink = this.getAttribute('data-magnet');

                fetch("{% url 'add_torrent' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({ magnet: magnetLink })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                    } else {
                        alert('Failed: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while adding the torrent.');
                });
            });
        });
    });
</script>

{% endblock %}
